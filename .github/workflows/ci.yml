name: OpenMRS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

env:
  ESM_NAME: "@mherman22/esm-rhd-app"
  JS_NAME: "mherman22-esm-rhd-app.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn verify
      - run: yarn build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist

  pre_release:
    runs-on: ubuntu-latest

    needs: build

    if: >-
      github.event_name == 'push'
      && github.repository == 'mherman22/openmrs-esm-rhd-app'
      && !startsWith(github.event.head_commit.message, '(chore) Release')

    concurrency:
      group: npm-next

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn version "$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")-pre.${{ github.run_number }}"
      - run: yarn build
      - run: yarn npm publish --access public --tag next
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'release' && github.repository == 'mherman22/openmrs-esm-rhd-app' }}

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
