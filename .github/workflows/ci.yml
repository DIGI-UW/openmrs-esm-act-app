name: OpenMRS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  ESM_NAME: "@act-registry/esm-act-app"
  JS_NAME: "act-registry-esm-act-app.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn verify
      - run: yarn check-translations
      - run: yarn build

  pre_release:
    runs-on: ubuntu-latest

    needs: build

    if: >-
      github.event_name == 'push'
      && github.repository == 'DIGI-UW/openmrs-esm-act-app'
      && !startsWith(github.event.head_commit.message, '(chore) Release')

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn version "$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")-pre.${{ github.run_number }}"
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: yarn build
      - run: yarn npm publish --access public --tag next
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      # The distro builds its frontend image with exactly this version, once npm serves it.
      - name: Rebuild the distro frontend with this version
        env:
          GH_TOKEN: ${{ secrets.DISTRO_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DISTRO_DISPATCH_TOKEN is not set, so the distro frontend was not rebuilt."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            npm view "@act-registry/esm-act-app@$VERSION" version > /dev/null 2>&1 && break
            sleep 10
          done
          npm view "@act-registry/esm-act-app@$VERSION" version
          gh api repos/DIGI-UW/openmrs-distro-referenceapplication/dispatches \
            -f event_type=frontend-prerelease -f "client_payload[act_app_version]=$VERSION"

  release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'release' && github.repository == 'DIGI-UW/openmrs-esm-act-app' }}

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
