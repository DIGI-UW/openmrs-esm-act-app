name: OpenMRS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-frontend-module.yml@main
    with:
      node_version: '20'
      pre_verify_command: yarn check-translations

  release:
    needs: build
    permissions:
      contents: write
      id-token: write
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/release-frontend-module.yml@main
    with:
      node_version: '20'
      publish: true
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  # Triggered here rather than by the release workflow, which dispatches before npm's next tag shows the new version
  build-distro-frontend:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait until npm serves this run's pre-release
        run: |
          end=$((SECONDS + 600))
          until npm view @act-registry/esm-act-app@next version --prefer-online | grep -q -- "-pre\.${{ github.run_number }}$"; do
            if [ $SECONDS -gt $end ]; then
              echo "::error::npm next is not pre.${{ github.run_number }} after 10 minutes"
              exit 1
            fi
            sleep 15
          done

      - name: Build the distro's frontend image
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: gh workflow run build-frontend.yml --repo DIGI-UW/openmrs-distro-referenceapplication
